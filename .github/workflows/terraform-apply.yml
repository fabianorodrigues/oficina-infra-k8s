name: Terraform Apply

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-k8s-${{ github.ref_name }}
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets['AWS_ACCESS_KEY_ID'] }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets['AWS_SECRET_ACCESS_KEY'] }}
  AWS_SESSION_TOKEN: ${{ secrets['AWS_SESSION_TOKEN'] }}
  AWS_REGION: ${{ secrets['AWS_REGION'] }}
  TF_STATE_BUCKET: ${{ secrets['TF_STATE_BUCKET'] }}
  ENVIRONMENT: ${{ vars.ENVIRONMENT || 'dev' }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME || 'oficina' }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'oficina-eks' }}
  ECR_REPOSITORY_NAME: ${{ vars.ECR_REPOSITORY_NAME || 'oficina-api' }}
  TF_VAR_ecr_mutable_alias_tag: ${{ vars.IMAGE_ALIAS_TAG || 'latest' }}
  TF_VAR_eks_cluster_role_arn: ${{ secrets['TF_VAR_eks_cluster_role_arn'] || vars.TF_VAR_eks_cluster_role_arn }}
  TF_VAR_eks_node_role_arn: ${{ secrets['TF_VAR_eks_node_role_arn'] || vars.TF_VAR_eks_node_role_arn }}
  TF_VAR_aws_load_balancer_controller_iam_mode: ${{ vars.TF_VAR_aws_load_balancer_controller_iam_mode || 'node' }}

jobs:
  apply-core:
    name: Apply core
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail

          required_vars=(
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            AWS_REGION
            TF_STATE_BUCKET
            TF_VAR_eks_cluster_role_arn
            TF_VAR_eks_node_role_arn
          )

          missing=0
          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name:-}" ]; then
              echo "${var_name} is required."
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

          if [[ ! "${TF_VAR_ecr_mutable_alias_tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "IMAGE_ALIAS_TAG variable must be a valid Docker image tag."
            exit 1
          fi

          if [ "${TF_VAR_aws_load_balancer_controller_iam_mode}" != "node" ] && [ "${TF_VAR_aws_load_balancer_controller_iam_mode}" != "irsa" ]; then
            echo "TF_VAR_aws_load_balancer_controller_iam_mode must be node or irsa."
            exit 1
          fi

          if [[ ! "${TF_VAR_eks_cluster_role_arn}" =~ ^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/.+$ ]]; then
            echo "TF_VAR_eks_cluster_role_arn must be a valid IAM Role ARN."
            exit 1
          fi

          if [[ ! "${TF_VAR_eks_node_role_arn}" =~ ^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/.+$ ]]; then
            echo "TF_VAR_eks_node_role_arn must be a valid IAM Role ARN."
            exit 1
          fi

          {
            printf 'TF_VAR_aws_region=%s\n' "${AWS_REGION}"
            printf 'TF_VAR_remote_state_region=%s\n' "${AWS_REGION}"
            printf 'TF_VAR_remote_state_bucket=%s\n' "${TF_STATE_BUCKET}"
            printf 'TF_VAR_project_name=%s\n' "${PROJECT_NAME}"
            printf 'TF_VAR_environment=%s\n' "${ENVIRONMENT}"
            printf 'TF_VAR_cluster_name=%s\n' "${EKS_CLUSTER_NAME}"
            printf 'TF_VAR_ecr_repository_name=%s\n' "${ECR_REPOSITORY_NAME}"
            printf 'TF_VAR_aws_load_balancer_controller_iam_mode=%s\n' "${TF_VAR_aws_load_balancer_controller_iam_mode}"
          } >> "${GITHUB_ENV}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure Terraform state bucket
        shell: bash
        run: |
          set -euo pipefail

          if aws s3api head-bucket --bucket "${TF_STATE_BUCKET}" 2>/dev/null; then
            echo "Terraform state bucket already exists."
          else
            echo "Creating Terraform state bucket."

            if [ "${AWS_REGION}" = "us-east-1" ]; then
              aws s3api create-bucket \
                --bucket "${TF_STATE_BUCKET}" \
                --region "${AWS_REGION}" >/dev/null
            else
              aws s3api create-bucket \
                --bucket "${TF_STATE_BUCKET}" \
                --region "${AWS_REGION}" \
                --create-bucket-configuration LocationConstraint="${AWS_REGION}" >/dev/null
            fi
          fi

          aws s3api put-bucket-versioning \
            --bucket "${TF_STATE_BUCKET}" \
            --versioning-configuration Status=Enabled >/dev/null

          aws s3api put-bucket-encryption \
            --bucket "${TF_STATE_BUCKET}" \
            --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}' >/dev/null

          aws s3api put-public-access-block \
            --bucket "${TF_STATE_BUCKET}" \
            --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true >/dev/null

      - name: Terraform init core
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="region=${AWS_REGION}" -backend-config="key=oficina-infra-k8s/${ENVIRONMENT}/core/terraform.tfstate" -backend-config="use_lockfile=true"

      - name: Terraform plan core
        shell: bash
        run: |
          set -euo pipefail

          if ! terraform plan -out=tfplan >/tmp/terraform-k8s-core-plan.log 2>&1; then
            echo "Terraform core plan failed."
            exit 1
          fi

          echo "Terraform core plan completed."

      - name: Terraform apply core
        shell: bash
        run: |
          set -euo pipefail

          if ! terraform apply -auto-approve tfplan >/tmp/terraform-k8s-core-apply.log 2>&1; then
            echo "Terraform core apply failed."
            exit 1
          fi

          echo "Terraform core apply completed."

      - name: Validate EKS and ECR
        shell: bash
        run: |
          set -euo pipefail

          aws eks wait cluster-active \
            --name "${EKS_CLUSTER_NAME}" \
            --region "${AWS_REGION}"

          aws eks wait nodegroup-active \
            --cluster-name "${EKS_CLUSTER_NAME}" \
            --nodegroup-name "${PROJECT_NAME}-node-group" \
            --region "${AWS_REGION}"

          aws ecr describe-repositories \
            --repository-names "${ECR_REPOSITORY_NAME}" \
            --region "${AWS_REGION}" >/dev/null

          echo "EKS and ECR validated."

  apply-addons:
    name: Apply addons
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: apply-core

    defaults:
      run:
        working-directory: terraform/addons

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate cluster access
        shell: bash
        run: |
          set -euo pipefail

          aws eks wait cluster-active \
            --name "${EKS_CLUSTER_NAME}" \
            --region "${AWS_REGION}"

          aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region "${AWS_REGION}" >/dev/null 2>&1

          if ! kubectl auth can-i get deployments -n kube-system >/dev/null 2>&1; then
            echo "Falha ao validar AWS Load Balancer Controller."
            exit 1
          fi

      - name: Prepare Terraform variables
        shell: bash
        run: |
          set -euo pipefail

          {
            printf 'TF_VAR_aws_region=%s\n' "${AWS_REGION}"
            printf 'TF_VAR_remote_state_region=%s\n' "${AWS_REGION}"
            printf 'TF_VAR_remote_state_bucket=%s\n' "${TF_STATE_BUCKET}"
            printf 'TF_VAR_project_name=%s\n' "${PROJECT_NAME}"
            printf 'TF_VAR_environment=%s\n' "${ENVIRONMENT}"
            printf 'TF_VAR_aws_load_balancer_controller_iam_mode=%s\n' "${TF_VAR_aws_load_balancer_controller_iam_mode}"
          } >> "${GITHUB_ENV}"

      - name: Terraform init addons
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="region=${AWS_REGION}" -backend-config="key=oficina-infra-k8s/${ENVIRONMENT}/addons/terraform.tfstate" -backend-config="use_lockfile=true"

      - name: Terraform plan addons
        shell: bash
        run: |
          set -euo pipefail

          if ! terraform plan -out=tfplan >/tmp/terraform-k8s-addons-plan.log 2>&1; then
            echo "Terraform addons plan failed."
            exit 1
          fi

          echo "Terraform addons plan completed."

      - name: Terraform apply addons
        shell: bash
        run: |
          set -euo pipefail

          if ! terraform apply -auto-approve tfplan >/tmp/terraform-k8s-addons-apply.log 2>&1; then
            echo "Terraform addons apply failed."
            exit 1
          fi

          echo "Terraform addons apply completed."

      - name: Validate AWS Load Balancer Controller
        shell: bash
        run: |
          set -euo pipefail

          if ! kubectl get deployment aws-load-balancer-controller -n kube-system >/dev/null 2>&1; then
            echo "Falha ao validar AWS Load Balancer Controller."
            exit 1
          fi

          if ! kubectl rollout status deployment/aws-load-balancer-controller -n kube-system --timeout=180s >/dev/null 2>&1; then
            echo "Falha ao validar AWS Load Balancer Controller."
            exit 1
          fi

          echo "AWS Load Balancer Controller validated."
