name: Terraform Apply

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: terraform

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets['AWS_ACCESS_KEY_ID'] }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets['AWS_SECRET_ACCESS_KEY'] }}
      AWS_SESSION_TOKEN: ${{ secrets['AWS_SESSION_TOKEN'] }}
      AWS_REGION: ${{ secrets['AWS_REGION'] }}
      TF_STATE_BUCKET: ${{ secrets['TF_STATE_BUCKET'] }}
      TF_VAR_ecr_mutable_alias_tag: ${{ vars.IMAGE_ALIAS_TAG || 'latest' }}
      TF_VAR_vpc_id: ${{ secrets['TF_VAR_vpc_id'] || vars.TF_VAR_vpc_id }}
      TF_VAR_subnet_ids: ${{ secrets['TF_VAR_subnet_ids'] || vars.TF_VAR_subnet_ids }}
      TF_VAR_eks_cluster_role_arn: ${{ secrets['TF_VAR_eks_cluster_role_arn'] || vars.TF_VAR_eks_cluster_role_arn }}
      TF_VAR_eks_node_role_arn: ${{ secrets['TF_VAR_eks_node_role_arn'] || vars.TF_VAR_eks_node_role_arn }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail

          required_vars=(
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            AWS_REGION
            TF_STATE_BUCKET
            TF_VAR_vpc_id
            TF_VAR_subnet_ids
            TF_VAR_eks_cluster_role_arn
            TF_VAR_eks_node_role_arn
          )

          missing=0
          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name:-}" ]; then
              echo "${var_name} secret is required."
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

          if [[ ! "${TF_VAR_ecr_mutable_alias_tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "IMAGE_ALIAS_TAG variable must be a valid Docker image tag."
            exit 1
          fi

          if [[ ! "${TF_VAR_vpc_id}" =~ ^vpc-[0-9a-fA-F]+$ ]]; then
            echo "TF_VAR_vpc_id must be a valid VPC ID."
            exit 1
          fi

          if [[ ! "${TF_VAR_subnet_ids}" =~ ^\[.*\]$ ]]; then
            echo 'TF_VAR_subnet_ids must be a Terraform/JSON list, for example ["subnet-abc","subnet-def"].'
            exit 1
          fi

          if [[ ! "${TF_VAR_eks_cluster_role_arn}" =~ ^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/.+$ ]]; then
            echo "TF_VAR_eks_cluster_role_arn must be a valid IAM Role ARN."
            exit 1
          fi

          if [[ ! "${TF_VAR_eks_node_role_arn}" =~ ^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/.+$ ]]; then
            echo "TF_VAR_eks_node_role_arn must be a valid IAM Role ARN."
            exit 1
          fi

          printf 'TF_VAR_aws_region=%s\n' "${AWS_REGION}" >> "${GITHUB_ENV}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure Terraform state bucket
        shell: bash
        run: |
          set -euo pipefail

          if aws s3api head-bucket --bucket "${TF_STATE_BUCKET}" 2>/dev/null; then
            echo "Terraform state bucket already exists: ${TF_STATE_BUCKET}"
          else
            echo "Creating Terraform state bucket: ${TF_STATE_BUCKET}"

            if [ "${AWS_REGION}" = "us-east-1" ]; then
              aws s3api create-bucket \
                --bucket "${TF_STATE_BUCKET}" \
                --region "${AWS_REGION}"
            else
              aws s3api create-bucket \
                --bucket "${TF_STATE_BUCKET}" \
                --region "${AWS_REGION}" \
                --create-bucket-configuration LocationConstraint="${AWS_REGION}"
            fi
          fi

          aws s3api put-bucket-versioning \
            --bucket "${TF_STATE_BUCKET}" \
            --versioning-configuration Status=Enabled

          aws s3api put-bucket-encryption \
            --bucket "${TF_STATE_BUCKET}" \
            --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

          aws s3api put-public-access-block \
            --bucket "${TF_STATE_BUCKET}" \
            --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

      - name: Terraform init
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="region=${AWS_REGION}"

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

      - name: Show Terraform outputs
        shell: bash
        run: |
          set -euo pipefail

          echo "ecr_repository_name=$(terraform output -raw ecr_repository_name)"
          echo "ecr_repository_url=$(terraform output -raw ecr_repository_url)"
          echo "ecr_registry_id=$(terraform output -raw ecr_registry_id)"
          echo "cluster_name=$(terraform output -raw cluster_name)"
          echo "cluster_endpoint=$(terraform output -raw cluster_endpoint)"
          echo "node_group_name=$(terraform output -raw node_group_name)"

      - name: Validate EKS cluster and node group
        shell: bash
        run: |
          set -euo pipefail

          cluster_name="$(terraform output -raw cluster_name)"
          node_group_name="$(terraform output -raw node_group_name)"

          aws eks wait cluster-active \
            --name "${cluster_name}" \
            --region "${AWS_REGION}"

          read -r cluster_status cluster_endpoint < <(
            aws eks describe-cluster \
              --name "${cluster_name}" \
              --region "${AWS_REGION}" \
              --query 'cluster.[status,endpoint]' \
              --output text
          )

          echo "EKS cluster name: ${cluster_name}"
          echo "EKS cluster status: ${cluster_status}"
          echo "EKS cluster endpoint: ${cluster_endpoint}"

          if [ "${cluster_status}" != "ACTIVE" ]; then
            echo "EKS cluster is not ACTIVE."
            exit 1
          fi

          aws eks wait nodegroup-active \
            --cluster-name "${cluster_name}" \
            --nodegroup-name "${node_group_name}" \
            --region "${AWS_REGION}"

          read -r node_group_status < <(
            aws eks describe-nodegroup \
              --cluster-name "${cluster_name}" \
              --nodegroup-name "${node_group_name}" \
              --region "${AWS_REGION}" \
              --query 'nodegroup.status' \
              --output text
          )

          echo "EKS node group name: ${node_group_name}"
          echo "EKS node group status: ${node_group_status}"

          if [ "${node_group_status}" != "ACTIVE" ]; then
            echo "EKS node group is not ACTIVE."
            exit 1
          fi

      - name: Validate ECR repository
        shell: bash
        run: |
          set -euo pipefail

          repository_name="$(terraform output -raw ecr_repository_name)"
          repository_url="$(terraform output -raw ecr_repository_url)"

          read -r name uri registry_id tag_mutability scan_on_push encryption_type < <(
            aws ecr describe-repositories \
              --repository-names "${repository_name}" \
              --region "${AWS_REGION}" \
              --query 'repositories[0].[repositoryName,repositoryUri,registryId,imageTagMutability,imageScanningConfiguration.scanOnPush,encryptionConfiguration.encryptionType]' \
              --output text
          )

          echo "ECR repository name: ${name}"
          echo "ECR repository URI: ${uri}"
          echo "ECR registry ID: ${registry_id}"
          echo "ECR tag mutability: ${tag_mutability}"
          echo "ECR scan on push: ${scan_on_push}"
          echo "ECR encryption: ${encryption_type}"

          if [ "${name}" != "${repository_name}" ]; then
            echo "ECR repository name does not match Terraform output."
            exit 1
          fi

          if [ "${uri}" != "${repository_url}" ]; then
            echo "ECR repository URI does not match Terraform output."
            exit 1
          fi
