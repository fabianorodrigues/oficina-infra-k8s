name: Terraform Apply

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: terraform

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets['AWS_ACCESS_KEY_ID'] }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets['AWS_SECRET_ACCESS_KEY'] }}
      AWS_SESSION_TOKEN: ${{ secrets['AWS_SESSION_TOKEN'] }}
      AWS_REGION: ${{ secrets['AWS_REGION'] }}
      TF_STATE_BUCKET: ${{ secrets['TF_STATE_BUCKET'] }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail

          required_vars=(
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            AWS_SESSION_TOKEN
            AWS_REGION
            TF_STATE_BUCKET
          )

          missing=0
          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name:-}" ]; then
              echo "${var_name} secret is required."
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

          printf 'TF_VAR_aws_region=%s\n' "${AWS_REGION}" >> "${GITHUB_ENV}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure Terraform state bucket
        shell: bash
        run: |
          set -euo pipefail

          if aws s3api head-bucket --bucket "${TF_STATE_BUCKET}" 2>/dev/null; then
            echo "Terraform state bucket already exists: ${TF_STATE_BUCKET}"
          else
            echo "Creating Terraform state bucket: ${TF_STATE_BUCKET}"

            if [ "${AWS_REGION}" = "us-east-1" ]; then
              aws s3api create-bucket \
                --bucket "${TF_STATE_BUCKET}" \
                --region "${AWS_REGION}"
            else
              aws s3api create-bucket \
                --bucket "${TF_STATE_BUCKET}" \
                --region "${AWS_REGION}" \
                --create-bucket-configuration LocationConstraint="${AWS_REGION}"
            fi
          fi

          aws s3api put-bucket-versioning \
            --bucket "${TF_STATE_BUCKET}" \
            --versioning-configuration Status=Enabled

          aws s3api put-bucket-encryption \
            --bucket "${TF_STATE_BUCKET}" \
            --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

          aws s3api put-public-access-block \
            --bucket "${TF_STATE_BUCKET}" \
            --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

      - name: Terraform init
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="region=${AWS_REGION}"

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

      - name: Show Terraform outputs
        shell: bash
        run: |
          set -euo pipefail

          echo "ecr_repository_name=$(terraform output -raw ecr_repository_name)"
          echo "ecr_repository_url=$(terraform output -raw ecr_repository_url)"
          echo "ecr_registry_id=$(terraform output -raw ecr_registry_id)"

      - name: Validate ECR repository
        shell: bash
        run: |
          set -euo pipefail

          repository_name="$(terraform output -raw ecr_repository_name)"

          read -r name uri registry_id tag_mutability scan_on_push encryption_type < <(
            aws ecr describe-repositories \
              --repository-names "${repository_name}" \
              --region "${AWS_REGION}" \
              --query 'repositories[0].[repositoryName,repositoryUri,registryId,imageTagMutability,imageScanningConfiguration.scanOnPush,encryptionConfiguration.encryptionType]' \
              --output text
          )

          echo "ECR repository name: ${name}"
          echo "ECR repository URI: ${uri}"
          echo "ECR registry ID: ${registry_id}"
          echo "ECR tag mutability: ${tag_mutability}"
          echo "ECR scan on push: ${scan_on_push}"
          echo "ECR encryption: ${encryption_type}"

          if [ "${name}" != "${repository_name}" ]; then
            echo "ECR repository name does not match Terraform output."
            exit 1
          fi

